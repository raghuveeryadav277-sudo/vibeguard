<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>QuickNotes</h1>
      <p>Capture ideas. Summarize them with AI.</p>
    </header>
    <main>
      <textarea id="note-input" placeholder="Type a note..."></textarea>
      <button id="save-btn">Save note</button>
      <button id="summarize-btn">Summarize with AI</button>
      <div id="notes-list"></div>
      <div id="summary-output"></div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
